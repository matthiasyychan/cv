        <div class="col-12 col-md-9">
            <form action="mailto:ai@matthiaschan.com" method="post" enctype="text/plain">
                <div class="form-group row">
                    <label for="name" class="col-md-2 col-form-label">姓名 <span class="text-danger">*</span></label>
                    <div class="col-md-10">
                        <input type="text" class="form-control" id="name" name="name" placeholder="請輸入姓名" required aria-required="true">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="emailid" class="col-md-2 col-form-label">電郵 <span class="text-danger">*</span></label>
                    <div class="col-md-10">
                        <input type="email" class="form-control" id="emailid" name="emailid" placeholder="your.email@example.com" required aria-required="true">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="subject" class="col-md-2 col-form-label">主題</label>
                    <div class="col-md-10">
                        <input type="text" class="form-control" id="subject" name="subject" placeholder="想談的主題">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="feedback" class="col-md-2 col-form-label">訊息內容 <span class="text-danger">*</span></label>
                    <div class="col-md-10">
                        <textarea class="form-control" id="feedback" name="feedback" rows="8" placeholder="請簡述您的需求或訊息..." required aria-required="true"></textarea>
                    </div>
                </div>
                <div class="form-group row">
                    <div class="offset-md-2 col-md-6">
                        <button type="submit" class="btn btn-primary">送出</button>
                        <button type="reset" class="btn btn-primary">重設</button>
                    </div>
                </div>
            </form>
